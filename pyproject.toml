[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-capability-negotiation-broker"
version = "0.1.0"
description = "Dynamic handshake engine for negotiating protocol versions, optional extensions, and tool virtualization tiers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-capability-negotiation-broker = "mcp_capability_negotiation_broker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_capability_negotiation_broker*"]
